plugins {
    id 'net.fabricmc.fabric-loom'
    id 'maven-publish'
}

// Load version configs
def vProps = new Properties()
file("../config.properties").withInputStream { vProps.load(it) }

// archivesBaseName = vProps.archives_base_name
base {
    archivesName = vProps.archives_base_name
}

version = "v${vProps.mod_version}+fabric-${vProps.minecraft_version}"
group = vProps.maven_group // http://maven.apache.org/guides/mini/guide-naming-conventions.html

repositories {
    // YACL (Yet Another Config Lib)
    maven {
        name "Xander Maven"
        url "https://maven.isxander.dev/releases"
    }
    // Mod Menu
    maven {
        name "TerraformersMC"
        url "https://maven.terraformersmc.com/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${vProps.minecraft_version}"
//    mappings loom.officialMojangMappings()

    implementation "net.fabricmc:fabric-loader:${vProps.fabric_loader_version}"

    api "net.fabricmc.fabric-api:fabric-api:${vProps.fabric_api_version.contains('+') ? vProps.fabric_api_version : vProps.fabric_api_version + '+' + vProps.minecraft_version}"

    implementation "dev.isxander:yet-another-config-lib:${vProps.yacl_version}-fabric"

    api("com.terraformersmc:modmenu:${vProps.modmenu_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "disable_compliance_notification_test"
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = vProps.java_version as Integer
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(vProps.java_version as Integer)
    }

    sourceSets.main.java {
        srcDirs += ['../src/fabric']
        srcDirs += ['../src/main']
        exclude '**/gametest/**'
    }

    sourceSets.main.resources.srcDirs += ['../src/fabric/resources']
    sourceSets.main.resources.srcDirs += ['../src/main/resources']

    sourceCompatibility = JavaLanguageVersion.of(vProps.java_version as Integer)
    targetCompatibility = JavaLanguageVersion.of(vProps.java_version as Integer)
}

sourceSets.gametest {
    java.srcDirs = [file('../src/fabric/gametest/java')]
    resources.srcDirs = [file('../src/fabric/gametest/resources')]
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", vProps.minecraft_version

    filesMatching("fabric.mod.json") {
        expand "version": vProps.mod_version,
                "minecraft_version": vProps.minecraft_version,
                "fabric_loader_version": vProps.fabric_loader_version,
                "java_version": vProps.java_version,
                "yacl_major_version": vProps.yacl_version.split('\\.')[0],
                "modmenu_major_version": vProps.modmenu_version.split('\\.')[0]
    }

    filesMatching("disable_compliance_notification.mixins.json") {
        expand "java_version": vProps.java_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.release = vProps.java_version as Integer
}

jar {
    from("LICENSE") {
        rename { "${it}_${archivesBaseName}" }
    }
}

tasks.register('gametestJar', Jar) {
    from sourceSets.gametest.output
    archiveClassifier = 'gametest'
    destinationDirectory = file("$buildDir/libs")
}

tasks.named('build') {
    dependsOn 'gametestJar'
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }

    repositories {
    }
}
