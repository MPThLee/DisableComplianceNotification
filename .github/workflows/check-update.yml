name: Check Minecraft Update

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minecraft-update-check
  cancel-in-progress: false

jobs:
  test-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find latest Minecraft branch
        id: base
        shell: bash
        run: |
          LATEST=$(git branch -r --sort=-version:refname --list 'origin/mc*' | head -1 | sed 's|^ *origin/||')
          if [ -z "$LATEST" ]; then
            LATEST="${{ github.ref_name }}"
          fi
          echo "branch=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Testing from $LATEST"

      - name: Checkout latest Minecraft branch
        run: git switch --detach "origin/${{ steps.base.outputs.branch }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Mojang release manifest
        id: check
        run: python3 tools/check-update.py

      - name: Check whether candidate branch already passed
        if: steps.check.outputs.has_update == 'true'
        id: existing
        shell: bash
        run: |
          BRANCH="mc${{ steps.check.outputs.new_version }}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$BRANCH already exists; no candidate work is needed"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare candidate dependency versions
        if: steps.check.outputs.has_update == 'true' && steps.existing.outputs.skip == 'false'
        run: >-
          python3 tools/check-update.py --apply
          --target-version "${{ steps.check.outputs.new_version }}"

      - name: Read candidate Java version
        if: steps.check.outputs.has_update == 'true' && steps.existing.outputs.skip == 'false'
        id: config
        shell: bash
        run: echo "java_version=$(grep '^java_version=' config.properties | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"

      - name: Set up Java ${{ steps.config.outputs.java_version }}
        if: steps.check.outputs.has_update == 'true' && steps.existing.outputs.skip == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.config.outputs.java_version }}
          cache: gradle
          cache-dependency-path: |
            config.properties
            fabric/*.gradle*
            neoforge/*.gradle*
            forge/*.gradle*

      - name: Set up swap space
        if: steps.check.outputs.has_update == 'true' && steps.existing.outputs.skip == 'false'
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 10

      - name: Install xvfb
        if: steps.check.outputs.has_update == 'true' && steps.existing.outputs.skip == 'false'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build Fabric candidate
        if: steps.check.outputs.has_update == 'true' && steps.existing.outputs.skip == 'false'
        id: build_fabric
        continue-on-error: true
        working-directory: fabric
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --console=plain

      - name: Gate Fabric candidate in-world
        if: steps.build_fabric.outcome == 'success'
        id: gate_fabric
        continue-on-error: true
        timeout-minutes: 10
        run: ./tools/test/run_client_gate.sh fabric --xvfb

      - name: Build NeoForge candidate
        if: steps.check.outputs.has_update == 'true' && steps.existing.outputs.skip == 'false'
        id: build_neoforge
        continue-on-error: true
        working-directory: neoforge
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --console=plain

      - name: Gate NeoForge candidate in-world
        if: steps.build_neoforge.outcome == 'success'
        id: gate_neoforge
        continue-on-error: true
        timeout-minutes: 10
        run: ./tools/test/run_client_gate.sh neoforge --xvfb

      - name: Build Forge candidate
        if: steps.check.outputs.has_update == 'true' && steps.existing.outputs.skip == 'false'
        id: build_forge
        continue-on-error: true
        working-directory: forge
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --console=plain

      - name: Gate Forge candidate in-world
        if: steps.build_forge.outcome == 'success'
        id: gate_forge
        continue-on-error: true
        timeout-minutes: 10
        run: ./tools/test/run_client_gate.sh forge --xvfb

      - name: Record passing compatibility evidence
        if: >-
          steps.gate_fabric.outcome == 'success' &&
          steps.gate_neoforge.outcome == 'success' &&
          steps.gate_forge.outcome == 'success'
        id: record
        continue-on-error: true
        run: python3 tools/record-minecraft-compatibility.py

      - name: Validate candidate tooling and metadata
        if: steps.record.outcome == 'success'
        id: candidate_tests
        continue-on-error: true
        run: python3 -m unittest discover -s tools/test -p 'test_*.py'

      - name: Upload candidate logs and evidence
        if: >-
          always() &&
          steps.check.outputs.has_update == 'true' &&
          steps.existing.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-${{ steps.check.outputs.new_version }}-compatibility-probe
          if-no-files-found: warn
          retention-days: 14
          path: |
            fabric/build/client-gate.log
            fabric/build/client-gate-result.json
            fabric/run/logs/
            neoforge/build/client-gate.log
            neoforge/build/client-gate-result.json
            neoforge/run/logs/
            forge/build/client-gate.log
            forge/build/client-gate-result.json
            forge/run/logs/

      - name: Reject failing candidate
        if: >-
          always() &&
          steps.check.outputs.has_update == 'true' &&
          steps.existing.outputs.skip == 'false' &&
          (steps.build_fabric.outcome != 'success' ||
          steps.gate_fabric.outcome != 'success' ||
          steps.build_neoforge.outcome != 'success' ||
          steps.gate_neoforge.outcome != 'success' ||
          steps.build_forge.outcome != 'success' ||
          steps.gate_forge.outcome != 'success' ||
          steps.record.outcome != 'success' ||
          steps.candidate_tests.outcome != 'success')
        shell: bash
        run: |
          {
            echo "## Minecraft ${{ steps.check.outputs.new_version }} candidate failed"
            echo
            echo "No branch or compatibility record was pushed. Inspect the uploaded loader logs and failed steps."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Create tested Minecraft branch
        if: >-
          steps.check.outputs.has_update == 'true' &&
          steps.existing.outputs.skip == 'false' &&
          steps.candidate_tests.outcome == 'success'
        env:
          MC_VERSION: ${{ steps.check.outputs.new_version }}
          MOD_VERSION: ${{ steps.check.outputs.mod_version }}
        shell: bash
        run: |
          BRANCH="mc${MC_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add config.properties README.md DOWNLOAD.md data/minecraft-compatibility.json
          if git diff --cached --quiet; then
            echo "Candidate produced no repository update" >&2
            exit 1
          fi
          git commit -m "feat: update to v${MOD_VERSION} for minecraft ${MC_VERSION}"
          git push -u origin "$BRANCH"
