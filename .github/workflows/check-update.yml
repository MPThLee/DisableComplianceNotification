name: Check Minecraft Update

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: minecraft-update-check
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      base_branch: ${{ steps.base.outputs.branch }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      candidate_mod_version: ${{ steps.plan.outputs.candidate_mod_version }}
      candidate_version: ${{ steps.plan.outputs.candidate_version }}
      needs_publish: ${{ steps.plan.outputs.needs_work }}
      target_branch: ${{ steps.plan.outputs.target_branch }}

    steps:
      - name: Checkout repository without write credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find latest maintained Minecraft branch
        id: base
        shell: bash
        env:
          FALLBACK_BRANCH: ${{ github.ref_name }}
        run: |
          latest=$(git branch -r --sort=-version:refname --list 'origin/mc*' | head -1 | sed 's|^ *origin/||')
          if [ -z "$latest" ]; then
            latest="$FALLBACK_BRANCH"
          fi
          if [[ ! "$latest" =~ ^mc[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Unsafe Minecraft branch name: $latest" >&2
            exit 1
          fi
          echo "branch=$latest" >> "$GITHUB_OUTPUT"
          echo "Testing from $latest"

      - name: Checkout latest maintained Minecraft branch
        shell: bash
        env:
          BASE_BRANCH: ${{ steps.base.outputs.branch }}
        run: git switch --detach "origin/$BASE_BRANCH"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Check Mojang release manifest
        id: check
        run: python3 tools/check-update.py

      - name: Check stored evidence for the current branch
        id: evidence
        shell: bash
        run: |
          if python3 tools/record-minecraft-compatibility.py --check-current; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "verified=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Plan candidate verification
        id: plan
        shell: bash
        env:
          BASE_BRANCH: ${{ steps.base.outputs.branch }}
          CURRENT_MOD_VERSION: ${{ steps.check.outputs.current_mod_version }}
          CURRENT_VERSION: ${{ steps.check.outputs.current_version }}
          HAS_UPDATE: ${{ steps.check.outputs.has_update }}
          NEW_MOD_VERSION: ${{ steps.check.outputs.mod_version }}
          NEW_VERSION: ${{ steps.check.outputs.new_version }}
          VERIFIED_CURRENT: ${{ steps.evidence.outputs.verified }}
        run: |
          case "$HAS_UPDATE" in
            true)
              candidate_version="$NEW_VERSION"
              candidate_mod_version="$NEW_MOD_VERSION"
              needs_work=true
              ;;
            false)
              candidate_version="$CURRENT_VERSION"
              candidate_mod_version="$CURRENT_MOD_VERSION"
              if [ "$VERIFIED_CURRENT" = true ]; then
                needs_work=false
              else
                needs_work=true
              fi
              ;;
            *)
              echo "Invalid update status: $HAS_UPDATE" >&2
              exit 1
              ;;
          esac

          if [[ ! "$BASE_BRANCH" =~ ^mc[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Unsafe base branch: $BASE_BRANCH" >&2
            exit 1
          fi
          if [[ ! "$candidate_version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Unsafe candidate version: $candidate_version" >&2
            exit 1
          fi
          if [[ ! "$candidate_mod_version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Unsafe candidate mod version: $candidate_mod_version" >&2
            exit 1
          fi

          {
            echo "base_sha=$(git rev-parse HEAD)"
            echo "candidate_mod_version=$candidate_mod_version"
            echo "candidate_version=$candidate_version"
            echo "has_update=$HAS_UPDATE"
            echo "needs_work=$needs_work"
            echo "target_branch=mc$candidate_version"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare candidate dependency versions
        if: steps.plan.outputs.has_update == 'true'
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ steps.plan.outputs.candidate_version }}
        run: >-
          python3 tools/check-update.py --apply
          --target-version "$CANDIDATE_VERSION"

      - name: Read candidate Java version
        if: steps.plan.outputs.needs_work == 'true'
        id: config
        shell: bash
        run: |
          java_version=$(grep '^java_version=' config.properties | cut -d'=' -f2)
          if [[ ! "$java_version" =~ ^[0-9]+$ ]]; then
            echo "Invalid Java version: $java_version" >&2
            exit 1
          fi
          echo "java_version=$java_version" >> "$GITHUB_OUTPUT"

      - name: Set up Java ${{ steps.config.outputs.java_version }}
        if: steps.plan.outputs.needs_work == 'true'
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: ${{ steps.config.outputs.java_version }}
          cache: gradle
          cache-dependency-path: |
            config.properties
            fabric/*.gradle*
            neoforge/*.gradle*
            forge/*.gradle*

      - name: Set up swap space
        if: steps.plan.outputs.needs_work == 'true'
        shell: bash
        run: |
          sudo fallocate -l 10G /swapfile-dcn
          sudo chmod 600 /swapfile-dcn
          sudo mkswap /swapfile-dcn
          sudo swapon /swapfile-dcn

      - name: Install xvfb
        if: steps.plan.outputs.needs_work == 'true'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build Fabric candidate
        if: steps.plan.outputs.needs_work == 'true'
        id: build_fabric
        continue-on-error: true
        working-directory: fabric
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --console=plain

      - name: Gate Fabric candidate in-world
        if: steps.build_fabric.outcome == 'success'
        id: gate_fabric
        continue-on-error: true
        timeout-minutes: 10
        run: ./tools/test/run_client_gate.sh fabric --xvfb

      - name: Build NeoForge candidate
        if: steps.plan.outputs.needs_work == 'true'
        id: build_neoforge
        continue-on-error: true
        working-directory: neoforge
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --console=plain

      - name: Gate NeoForge candidate in-world
        if: steps.build_neoforge.outcome == 'success'
        id: gate_neoforge
        continue-on-error: true
        timeout-minutes: 10
        run: ./tools/test/run_client_gate.sh neoforge --xvfb

      - name: Build Forge candidate
        if: steps.plan.outputs.needs_work == 'true'
        id: build_forge
        continue-on-error: true
        working-directory: forge
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --console=plain

      - name: Gate Forge candidate in-world
        if: steps.build_forge.outcome == 'success'
        id: gate_forge
        continue-on-error: true
        timeout-minutes: 10
        run: ./tools/test/run_client_gate.sh forge --xvfb

      - name: Record passing compatibility evidence
        if: >-
          steps.gate_fabric.outcome == 'success' &&
          steps.gate_neoforge.outcome == 'success' &&
          steps.gate_forge.outcome == 'success'
        id: record
        continue-on-error: true
        run: python3 tools/record-minecraft-compatibility.py

      - name: Validate candidate tooling and metadata
        if: steps.record.outcome == 'success'
        id: candidate_tests
        continue-on-error: true
        run: python3 -m unittest discover -s tools/test -p 'test_*.py'

      - name: Create tested candidate patch
        if: steps.candidate_tests.outcome == 'success'
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          git diff --binary -- config.properties README.md DOWNLOAD.md data/minecraft-compatibility.json > candidate-update.patch
          if [ ! -s candidate-update.patch ]; then
            echo "Passing candidate produced no repository update" >&2
            exit 1
          fi
          sha256sum candidate-update.patch > candidate-update.patch.sha256

      - name: Upload tested candidate patch
        if: steps.patch.outcome == 'success'
        id: candidate_artifact
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minecraft-${{ steps.plan.outputs.candidate_version }}-tested-candidate
          if-no-files-found: error
          retention-days: 3
          path: |
            candidate-update.patch
            candidate-update.patch.sha256

      - name: Upload candidate logs and evidence
        if: steps.plan.outputs.needs_work == 'true' && always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minecraft-${{ steps.plan.outputs.candidate_version }}-compatibility-probe
          if-no-files-found: warn
          retention-days: 14
          path: |
            fabric/build/client-gate.log
            fabric/build/client-gate-result.json
            fabric/run/logs/
            neoforge/build/client-gate.log
            neoforge/build/client-gate-result.json
            neoforge/run/logs/
            forge/build/client-gate.log
            forge/build/client-gate-result.json
            forge/run/logs/

      - name: Reject failing candidate
        if: >-
          always() &&
          steps.plan.outputs.needs_work == 'true' &&
          (steps.build_fabric.outcome != 'success' ||
          steps.gate_fabric.outcome != 'success' ||
          steps.build_neoforge.outcome != 'success' ||
          steps.gate_neoforge.outcome != 'success' ||
          steps.build_forge.outcome != 'success' ||
          steps.gate_forge.outcome != 'success' ||
          steps.record.outcome != 'success' ||
          steps.candidate_tests.outcome != 'success' ||
          steps.patch.outcome != 'success' ||
          steps.candidate_artifact.outcome != 'success')
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ steps.plan.outputs.candidate_version }}
        run: |
          {
            echo "## Minecraft $CANDIDATE_VERSION candidate failed"
            echo
            echo "No branch or compatibility record was pushed. Inspect the uploaded loader logs and failed steps."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  publish:
    needs: probe
    if: needs.probe.result == 'success' && needs.probe.outputs.needs_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout exact tested base with publish credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ needs.probe.outputs.base_sha }}

      - name: Download tested candidate patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: minecraft-${{ needs.probe.outputs.candidate_version }}-tested-candidate
          path: candidate-artifact

      - name: Verify, commit, and push tested candidate
        shell: bash
        env:
          BASE_BRANCH: ${{ needs.probe.outputs.base_branch }}
          BASE_SHA: ${{ needs.probe.outputs.base_sha }}
          CANDIDATE_MOD_VERSION: ${{ needs.probe.outputs.candidate_mod_version }}
          CANDIDATE_VERSION: ${{ needs.probe.outputs.candidate_version }}
          TARGET_BRANCH: ${{ needs.probe.outputs.target_branch }}
        run: |
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unsafe base SHA: $BASE_SHA" >&2
            exit 1
          fi
          if [[ ! "$BASE_BRANCH" =~ ^mc[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Unsafe base branch: $BASE_BRANCH" >&2
            exit 1
          fi
          if [[ ! "$CANDIDATE_VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Unsafe candidate version: $CANDIDATE_VERSION" >&2
            exit 1
          fi
          if [[ ! "$CANDIDATE_MOD_VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Unsafe candidate mod version: $CANDIDATE_MOD_VERSION" >&2
            exit 1
          fi
          if [ "$TARGET_BRANCH" != "mc$CANDIDATE_VERSION" ]; then
            echo "Unsafe target branch: $TARGET_BRANCH" >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$BASE_SHA" ]; then
            echo "Publish checkout does not match tested base" >&2
            exit 1
          fi

          cd candidate-artifact
          sha256sum --check candidate-update.patch.sha256
          cd ..

          remote_base=$(git ls-remote --heads origin "refs/heads/$BASE_BRANCH" | awk '{print $1}')
          if [ "$remote_base" != "$BASE_SHA" ]; then
            echo "Tested base branch moved or disappeared: $remote_base" >&2
            exit 1
          fi

          remote_target=$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')
          if [ -n "$remote_target" ] && [ "$remote_target" != "$BASE_SHA" ]; then
            echo "Target branch changed or was not the tested base: $remote_target" >&2
            exit 1
          fi

          git switch -c "$TARGET_BRANCH"
          git apply --check candidate-artifact/candidate-update.patch
          git apply --index candidate-artifact/candidate-update.patch

          while IFS= read -r path; do
            case "$path" in
              config.properties|README.md|DOWNLOAD.md|data/minecraft-compatibility.json) ;;
              *)
                echo "Candidate patch contains an unexpected path: $path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --cached --name-only)

          if git diff --cached --quiet; then
            echo "Candidate patch contains no repository update" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: update to v$CANDIDATE_MOD_VERSION for minecraft $CANDIDATE_VERSION"
          git push -u origin "HEAD:refs/heads/$TARGET_BRANCH"

          {
            echo "## Minecraft $CANDIDATE_VERSION passed"
            echo
            echo "All Fabric, NeoForge, and Forge gates passed; pushed $TARGET_BRANCH."
          } >> "$GITHUB_STEP_SUMMARY"
