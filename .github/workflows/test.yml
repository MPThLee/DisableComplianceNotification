name: Compliance Notification Test

on:
  push:
    branches:
      - mc*
  pull_request:
    branches:
      - mc*
  workflow_dispatch:

jobs:
  test-fabric:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read config.properties
        id: config
        run: |
          echo "mc_version=$(grep '^minecraft_version=' config.properties | cut -d'=' -f2)" >> $GITHUB_OUTPUT
          echo "java_version=$(grep '^java_version=' config.properties | cut -d'=' -f2)" >> $GITHUB_OUTPUT

      - name: Test build tooling
        run: python3 -m unittest discover -s tools/test -p 'test_*.py'

      - name: Setup Java ${{ steps.config.outputs.java_version }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ steps.config.outputs.java_version }}
          cache: gradle
          cache-dependency-path: |
            config.properties
            fabric/*.gradle*
            fabric/gradle.properties

      - name: Set up swap space
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 10

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build mod
        working-directory: fabric
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Run client gametest (compliance filtering)
        working-directory: fabric
        run: xvfb-run -a ./gradlew runClientGameTest
        timeout-minutes: 5
        env:
          _JAVA_OPTIONS: "-Duser.country=KR -Duser.language=ko"

      - name: Run two-minute client compliance gate
        run: ./tools/test/run_client_gate.sh fabric --xvfb
        timeout-minutes: 10

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-fabric
          path: |
            fabric/build/run/clientGameTest/logs/
            fabric/run/logs/
            fabric/build/client-gate.log
            fabric/build/client-gate-result.json
          retention-days: 7

  test-neoforge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read config.properties
        id: config
        run: |
          echo "java_version=$(grep '^java_version=' config.properties | cut -d'=' -f2)" >> $GITHUB_OUTPUT

      - name: Setup Java ${{ steps.config.outputs.java_version }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ steps.config.outputs.java_version }}
          cache: gradle
          cache-dependency-path: |
            config.properties
            neoforge/*.gradle*
            neoforge/gradle.properties

      - name: Set up swap space
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 10

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build mod
        working-directory: neoforge
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Run two-minute client compliance gate
        run: ./tools/test/run_client_gate.sh neoforge --xvfb
        timeout-minutes: 10

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-neoforge
          path: |
            neoforge/run/logs/
            neoforge/build/client-gate.log
            neoforge/build/client-gate-result.json
          retention-days: 7

  test-forge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read config.properties
        id: config
        run: |
          echo "java_version=$(grep '^java_version=' config.properties | cut -d'=' -f2)" >> $GITHUB_OUTPUT

      - name: Setup Java ${{ steps.config.outputs.java_version }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ steps.config.outputs.java_version }}
          cache: gradle
          cache-dependency-path: |
            config.properties
            forge/*.gradle*
            forge/gradle.properties

      - name: Set up swap space
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 10

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build mod
        working-directory: forge
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Run two-minute client compliance gate
        run: ./tools/test/run_client_gate.sh forge --xvfb
        timeout-minutes: 10

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-forge
          path: |
            forge/run/logs/
            forge/build/client-gate.log
            forge/build/client-gate-result.json
          retention-days: 7
