name: Compliance Notification Test

on:
  push:
    branches:
      - mc*
  pull_request:
    branches:
      - mc*
  workflow_dispatch:

jobs:
  test-fabric:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read config.properties
        id: config
        run: |
          echo "mc_version=$(grep '^minecraft_version=' config.properties | cut -d'=' -f2)" >> $GITHUB_OUTPUT
          echo "java_version=$(grep '^java_version=' config.properties | cut -d'=' -f2)" >> $GITHUB_OUTPUT

      - name: Setup Java ${{ steps.config.outputs.java_version }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ steps.config.outputs.java_version }}
          cache: gradle
          cache-dependency-path: |
            config.properties
            fabric/*.gradle*
            fabric/gradle.properties

      - name: Set up swap space
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 10

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build mod
        working-directory: fabric
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Run client gametest (compliance filtering)
        working-directory: fabric
        run: xvfb-run -a ./gradlew runClientGameTest
        timeout-minutes: 5
        env:
          _JAVA_OPTIONS: "-Duser.country=KR -Duser.language=ko"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-fabric
          path: |
            fabric/run/logs/
          retention-days: 7

  test-neoforge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read config.properties
        id: config
        run: |
          echo "java_version=$(grep '^java_version=' config.properties | cut -d'=' -f2)" >> $GITHUB_OUTPUT

      - name: Setup Java ${{ steps.config.outputs.java_version }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ steps.config.outputs.java_version }}
          cache: gradle
          cache-dependency-path: |
            config.properties
            neoforge/*.gradle*
            neoforge/gradle.properties

      - name: Set up swap space
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 10

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build mod
        working-directory: neoforge
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Run client for smoke test (1 minute)
        working-directory: neoforge
        run: |
          # Run client in background with xvfb
          timeout 60 xvfb-run -a ./gradlew runClient || exit_code=$?
          # timeout returns 124 when it kills the process, which is expected
          if [ "${exit_code:-0}" -eq 124 ]; then
            echo "Client ran successfully for 1 minute (expected timeout)"
            exit 0
          elif [ "${exit_code:-0}" -eq 0 ]; then
            echo "Client exited cleanly"
            exit 0
          else
            echo "Client crashed with exit code $exit_code"
            exit 1
          fi
        env:
          _JAVA_OPTIONS: "-Duser.country=KR -Duser.language=ko"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-neoforge
          path: |
            neoforge/run/logs/
          retention-days: 7
