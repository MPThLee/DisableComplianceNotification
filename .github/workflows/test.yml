name: Compliance Notification Test

on:
  push:
    branches:
      - mc*
  pull_request:
    branches:
      - mc*
  workflow_dispatch:

jobs:
  test-fabric:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read config.properties
        id: config
        run: |
          echo "mc_version=$(grep '^minecraft_version=' config.properties | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"
          echo "java_version=$(grep '^java_version=' config.properties | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"

      - name: Test build tooling
        run: python3 -m unittest discover -s tools/test -p 'test_*.py'

      - name: Setup Java ${{ steps.config.outputs.java_version }}
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: "temurin"
          java-version: ${{ steps.config.outputs.java_version }}
          cache: gradle
          cache-dependency-path: |
            config.properties
            fabric/*.gradle*
            fabric/gradle.properties

      - name: Set up swap space
        shell: bash
        run: |
          sudo fallocate -l 10G /swapfile-dcn
          sudo chmod 600 /swapfile-dcn
          sudo mkswap /swapfile-dcn
          sudo swapon /swapfile-dcn

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build mod
        working-directory: fabric
        timeout-minutes: 60
        run: |
          chmod +x ./gradlew
          for attempt in 1 2; do
            if ./gradlew build --console=plain; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi
            echo "Gradle build attempt failed; retrying once after 15 seconds" >&2
            sleep 15
          done

      - name: Run client gametest (compliance filtering)
        working-directory: fabric
        run: xvfb-run -a ./gradlew runClientGameTest
        timeout-minutes: 5
        env:
          _JAVA_OPTIONS: "-Duser.country=KR -Duser.language=ko"

      - name: Run two-minute client compliance gate
        run: ./tools/test/run_client_gate.sh fabric --xvfb
        timeout-minutes: 10

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-logs-fabric
          path: |
            fabric/build/run/clientGameTest/logs/
            fabric/run/logs/
            fabric/build/client-gate.log
            fabric/build/client-gate-result.json
          retention-days: 7

