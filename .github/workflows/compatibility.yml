name: Published Compatibility Report

on:
  workflow_dispatch:
    inputs:
      minecraft_version:
        description: "Exact version (blank checks stable releases only)"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      minecraft_version:
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: compatibility-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      has_work: ${{ steps.plan.outputs.has_work }}
    steps:
      - name: Checkout report branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Plan published-jar checks
        id: plan
        env:
          TARGET_VERSION: ${{ inputs.minecraft_version }}
        run: |
          python3 tools/test/compatibility_report.py plan --target "$TARGET_VERSION"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  check:
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    name: ${{ matrix.minecraft_version }} / ${{ matrix.loader }} / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout report branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Prepare unchanged published jar
        id: prepare
        env:
          TARGET_VERSION: ${{ matrix.minecraft_version }}
          LOADER: ${{ matrix.loader }}
          MODE: ${{ matrix.mode }}
        run: |
          python3 tools/test/prepare_published_runtime.py --loader "$LOADER" --target "$TARGET_VERSION" --mode "$MODE" --result preparation.json
          echo "java_version=$(sed -n 's/^java_version=//p' config.properties)" >> "$GITHUB_OUTPUT"
      - name: Set up Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: ${{ steps.prepare.outputs.java_version }}
          cache: gradle
          cache-dependency-path: |
            config.properties
            ${{ matrix.loader }}/*.gradle*
            ${{ matrix.loader }}/gradle.properties
      - name: Prepare client environment
        run: |
          sudo fallocate -l 10G /swapfile-dcn
          sudo chmod 600 /swapfile-dcn
          sudo mkswap /swapfile-dcn
          sudo swapon /swapfile-dcn
          sudo apt-get update && sudo apt-get install -y xvfb
      - name: Check real notifications and supported config integration
        id: gate
        timeout-minutes: 20
        env:
          LOADER: ${{ matrix.loader }}
          MODE: ${{ matrix.mode }}
        run: |
          chmod +x "$LOADER/gradlew"
          args=()
          if [ "$MODE" = deps ]; then args+=(--with-dependencies); fi
          python3 tools/test/run_client_gate.py "$LOADER" --xvfb --runtime-seconds 150 --startup-timeout-seconds 900 "${args[@]}"
      - name: Record outcome, including unavailable dependencies
        if: always()
        env:
          LOADER: ${{ matrix.loader }}
          OUTCOME: ${{ steps.gate.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python3 tools/test/compatibility_report.py record
          --preparation preparation.json --gate "$LOADER/build/client-gate-result.json"
          --log "$LOADER/build/client-gate.log"
          --outcome "$OUTCOME" --run-url "$RUN_URL" --output result.json
      - name: Upload result and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-${{ matrix.minecraft_version }}-${{ matrix.loader }}-${{ matrix.mode }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            result.json
            preparation.json
            ${{ matrix.loader }}/build/client-gate*
            ${{ matrix.loader }}/run/logs/

  report:
    needs: [plan, check]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.has_work == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout report branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Download check outcomes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: report-*-${{ github.run_attempt }}
          path: compatibility-results
      - name: Update compatibility report
        run: python3 tools/test/compatibility_report.py render --results compatibility-results
      - name: Commit actual report changes
        env:
          STATE_BRANCH: ${{ github.ref_name }}
        run: |
          git add COMPABILITY.md data/compatibility-results.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: update compatibility report [skip ci]"
          git push origin "HEAD:refs/heads/$STATE_BRANCH"
